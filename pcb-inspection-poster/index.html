<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manufacturing Trusted Hardware: Inspection Protocol Sketch for High-Integrity PCBs</title>
  <link rel="icon" type="image/svg+xml" href="../favicon-light.svg" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .poster-page {
      max-width: 1100px;
    }
    .poster-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }
    .poster-header h1 {
      font-size: 1.75rem;
      margin: 0 0 var(--space-sm);
    }
    .poster-header p {
      color: var(--text-secondary);
      margin: 0;
    }
    .poster-actions {
      margin-top: var(--space-md);
    }
    .poster-actions a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .poster-actions a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }
    .poster-frame {
      width: 100%;
      height: 85vh;
      min-height: 600px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="container poster-page">
    <header class="poster-header">
      <h1>Manufacturing Trusted Hardware</h1>
      <p>Inspection Protocol Sketch for High-Integrity PCBs</p>
      <p>Benjamin Hodgkiss &amp; David Bravo Comas &mdash; ERA:AI Fellowship, Winter 2026</p>
      <p class="poster-actions">
        <a href="../Benjamin_Hodgkiss_ERA_poster.pdf" download>Download PDF</a>
      </p>
    </header>

    <main>
      <iframe
        class="poster-frame"
        src="../Benjamin_Hodgkiss_ERA_poster.pdf"
        title="Manufacturing Trusted Hardware poster"
      ></iframe>
    </main>
  </div>
</body>
</html>
