<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Confirmation link problem · 100 Experts</title>
<style>
:root{ --paper:#F7F4EC; --panel:#FCFAF4; --ink:#1B1A17; --ink-soft:#46443D; --line:#DCD6C7; --accent:#235E40; --warn:#9C4221; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--paper);color:var(--ink);
  font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.55;}
.card{max-width:460px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:40px;text-align:center;box-shadow:0 4px 14px rgba(27,26,23,.08);}
.badge{width:54px;height:54px;border-radius:50%;background:var(--warn);color:#FCFAF4;
  display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;}
h1{margin:0 0 12px;font-size:1.6rem;letter-spacing:-.01em;}
p{margin:0 0 22px;color:var(--ink-soft);}
.btn{display:inline-block;padding:12px 24px;border-radius:10px;background:var(--accent);color:#FCFAF4;
  text-decoration:none;font-weight:600;font-size:.95rem;}
</style>
</head>
<body>
  <div class="card">
    <div class="badge" aria-hidden="true">!</div>
    <h1>This link didn't work</h1>
    <p>The confirmation link is invalid or has expired (links are good for 7 days). Open the survey again and resubmit to get a fresh confirmation email.</p>
    <a class="btn" href="https://proofworks.cc/100">Back to the survey &rarr;</a>
  </div>
</body>
</html>
